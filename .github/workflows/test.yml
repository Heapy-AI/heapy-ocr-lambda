name: OCR 테스트

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4
      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 개발 의존성 설치
        run: python -m pip install -r requirements-dev.txt
      - name: 정적 검사
        run: python -m ruff check .
      - name: 테스트
        run: python -m pytest
