AWSTemplateFormatVersion: '2010-09-09'
Description: GitHub OIDC 전용 코드 배포 역할 (작성자 김진우)
Parameters:
  GitHubRepository:
    Type: String
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  GitHubEnvironment:
    Type: String
    AllowedValues: [dev, production]
  GitHubSubjectPrefix:
    Type: String
    Description: 실제 발급 subject에서 확인한 repo 접두사
    AllowedPattern: 'repo:[A-Za-z0-9_.@-]+/[A-Za-z0-9_.@-]+'
  OidcProviderArn:
    Type: String
    Description: 확인된 token.actions.githubusercontent.com OIDC 공급자 ARN
  EcrRepositoryArn:
    Type: String
  WorkerFunctionName:
    Type: String
  JanitorFunctionName:
    Type: String
Resources:
  DeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      Description: !Sub '${GitHubRepository} ${GitHubEnvironment} OCR 코드 배포'
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Federated: !Ref OidcProviderArn}
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub '${GitHubSubjectPrefix}:environment:${GitHubEnvironment}'
      Policies:
        - PolicyName: image-version-deployment
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action: [ecr:BatchCheckLayerAvailability, ecr:InitiateLayerUpload,
                         ecr:UploadLayerPart, ecr:CompleteLayerUpload, ecr:PutImage,
                         ecr:BatchGetImage, ecr:DescribeImages, ecr:GetDownloadUrlForLayer]
                Resource: !Ref EcrRepositoryArn
              - Effect: Allow
                Action: [lambda:GetFunction, lambda:GetFunctionConfiguration,
                         lambda:UpdateFunctionCode, lambda:PublishVersion, lambda:GetAlias,
                         lambda:UpdateAlias, lambda:InvokeFunction]
                Resource:
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkerFunctionName}'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${WorkerFunctionName}:*'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${JanitorFunctionName}'
                  - !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${JanitorFunctionName}:*'
Outputs:
  DeploymentRoleArn: {Value: !GetAtt DeploymentRole.Arn}
