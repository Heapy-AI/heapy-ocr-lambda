AWSTemplateFormatVersion: '2010-09-09'
Description: 승인 후 생성할 OCR 이미지 저장소 (작성자 김진우)
Resources:
  Repository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      RepositoryPolicyText:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
            Condition:
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:*'
Outputs:
  RepositoryUri: {Value: !GetAtt Repository.RepositoryUri}
  RepositoryArn: {Value: !GetAtt Repository.Arn}
